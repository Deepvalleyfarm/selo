name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build (demo mode, no google-services.json needed)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'selo.Nachipa01.domain.*' assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }

  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules

  backoffice:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backoffice } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backoffice/package-lock.json }
      - run: npm ci
      - run: npm run build
