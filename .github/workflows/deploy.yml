name: Deploy to Firebase (mabala-f2d65)
# Manual deploy. Needs the repository secret FIREBASE_SERVICE_ACCOUNT (a service-account JSON key
# for mabala-f2d65 with the Firebase Admin, Cloud Functions Admin, Service Account User and
# Secret Manager Viewer roles). Settings > Secrets and variables > Actions > New repository secret.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "What to deploy (firebase deploy --only)"
        # Storage rules are NOT deployed from here: the default bucket is shared with Mabala, and its
        # rules (including SeloNachipa's paths) are deployed from the Mabala repo's storage.rules.
        default: "firestore,database,functions,hosting"
        required: true

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and build functions
        working-directory: functions
        run: npm ci && npm run build && npm test
      - name: Build back office
        working-directory: backoffice
        run: npm ci && npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Refuse to overwrite the shared Storage rules
        if: contains(inputs.only, 'storage')
        run: |
          echo "::error::Storage rules for mabala-f2d65 are owned by the Mabala repo (storage.rules). Update SeloNachipa's section there instead."
          exit 1
      - name: Deploy
        run: npx --yes firebase-tools@15.37.0 deploy --project mabala-f2d65 --only "${{ inputs.only }}" --non-interactive --force
